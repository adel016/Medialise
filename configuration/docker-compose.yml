version: "3.8"

services:
  web:
    build:
      context: ..
      dockerfile: configuration/Dockerfile
    container_name: medsearch_web
    env_file:
      - ../.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/medicsearch
    depends_on:
      mongo:
        condition: service_started
      qdrant:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ../frontend_backend:/app
      - ../scrapers:/app/scrapers
      - ../export_base_données:/app/export_base_données
      - ../data:/data

  mongo:
    image: mongo:6.0
    container_name: medsearch_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  qdrant:
    build:
      context: .
      dockerfile: Dockerfile.qdrant
    container_name: medsearch_qdrant
    environment:
      - QDRANT_HOST=0.0.0.0
      - QDRANT_ALLOW_EXTERNAL_HTTP=true
      - QDRANT_SERVICE_HOST=0.0.0.0
      - QDRANT_SERVICE_PORT=6333
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 3
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5
    container_name: medsearch_neo4j
    restart: unless-stopped
    ports:
      - "17474:7474"   # Neo4j Browser (host)
      - "17687:7687"   # Bolt (host)
    environment:
      - NEO4J_AUTH=neo4j/CHANGE_ME
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  mongo_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
