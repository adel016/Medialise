version: "3.8"

services:
  web:
    build:
      context: ..
      dockerfile: configuration/Dockerfile
    container_name: medsearch_web
    env_file:
      - ../.env
    depends_on:
      mongo:
        condition: service_started
      qdrant:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ../export_base_données:/app/export_base_données

  mongo:
    image: mongo:6.0
    container_name: medsearch_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  qdrant:
    build:
      context: .
      dockerfile: Dockerfile.qdrant
    container_name: medsearch_qdrant
    environment:
      - QDRANT_HOST=0.0.0.0
      - QDRANT_ALLOW_EXTERNAL_HTTP=true
      - QDRANT_SERVICE_HOST=0.0.0.0
      - QDRANT_SERVICE_PORT=6333
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 3
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  qdrant_data:
