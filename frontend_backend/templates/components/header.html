<link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">

<header class="site-header" id="siteHeader">
  <div class="header-container">
    <!-- Logo -->
    <a href="/" class="header-logo">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.5 20.5 10 4m5 .5-1 16M3 5l4.5 16M6.5 5l6 16M16.5 3l1 18M21 5l-6 16"/>
        </svg>
      </div>
      <span class="logo-text">Medialise</span>
    </a>

    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <!-- Actions -->
    <div class="header-actions" id="headerActions">
      <!-- Search Dropdown -->
      <div class="search-dropdown">
        <button class="search-toggle" id="searchToggle" aria-label="Recherche">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </button>

        <div class="search-menu" id="searchMenu">
          <a href="/search" class="search-menu-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <span>Recherche classique</span>
          </a>
          <a href="/vector-search" class="search-menu-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            </svg>
            <span>Recherche vectorielle</span>
          </a>
          <a href="/ai-search" class="search-menu-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" x2="12" y1="19" y2="22"></line>
            </svg>
            <span>Recherche IA (RAG)</span>
          </a>
          <div style="border-top: 1px solid #e2e8f0; margin: 4px 0;"></div>
          <a href="/interaction-checker" class="search-menu-item" style="color: #dc2626;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span>Interactions médicamenteuses</span>
          </a>
          <a href="/dashboard" class="search-menu-item" style="color: #8b5cf6;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="4" rx="1"/>
              <rect x="14" y="10" width="7" height="11" rx="1"/>
              <rect x="3" y="13" width="7" height="8" rx="1"/>
            </svg>
            <span>Tableau de bord</span>
          </a>
        </div>
      </div>

      <!-- User Menu -->
      <div class="user-menu">
        {% if g.user %}
          <a href="{{ url_for('users.profile') }}" class="user-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:4px;">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Profil
          </a>
          <a href="{{ url_for('users.logout') }}" class="user-link btn-logout">Déconnexion</a>
        {% else %}
          <a href="{{ url_for('users.login') }}" class="btn-login">Connexion</a>
        {% endif %}
      </div>

      <!-- Language Selector -->
      <div class="language-selector">
        <button class="language-toggle" id="languageToggle" aria-label="Changer de langue">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </button>
        
        <div class="language-menu" id="languageMenu">
          <a href="{{ url_for('set_language', language='fr') }}" class="language-menu-item {% if session.get('language', 'fr') == 'fr' %}active{% endif %}">
            <span class="flag">🇫🇷</span>
            <span>Français</span>
          </a>
          <a href="{{ url_for('set_language', language='en') }}" class="language-menu-item {% if session.get('language', 'fr') == 'en' %}active{% endif %}">
            <span class="flag">🇬🇧</span>
            <span>English</span>
          </a>
          <a href="{{ url_for('set_language', language='ar') }}" class="language-menu-item {% if session.get('language', 'fr') == 'ar' %}active{% endif %}">
            <span class="flag">🇸🇦</span>
            <span>العربية</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>

<script>
(function() {
  // Search Dropdown
  const searchToggle = document.getElementById('searchToggle');
  const searchMenu = document.getElementById('searchMenu');
  
  if (searchToggle && searchMenu) {
    searchToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      searchMenu.classList.toggle('active');
    });

    document.addEventListener('click', function(e) {
      if (!searchMenu.contains(e.target) && e.target !== searchToggle) {
        searchMenu.classList.remove('active');
      }
    });
  }

  // Mobile Menu
  const mobileToggle = document.getElementById('mobileMenuToggle');
  const headerActions = document.getElementById('headerActions');
  
  if (mobileToggle && headerActions) {
    mobileToggle.addEventListener('click', function() {
      headerActions.classList.toggle('mobile-active');
    });
  }

  // Language Selector
  const languageToggle = document.getElementById('languageToggle');
  const languageMenu = document.getElementById('languageMenu');
  
  if (languageToggle && languageMenu) {
    languageToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      languageMenu.classList.toggle('active');
    });

    document.addEventListener('click', function(e) {
      if (!languageMenu.contains(e.target) && e.target !== languageToggle) {
        languageMenu.classList.remove('active');
      }
    });
  }

  // Scroll Effect
  const header = document.getElementById('siteHeader');
  let lastScroll = 0;

  window.addEventListener('scroll', function() {
    const currentScroll = window.pageYOffset;
    
    if (currentScroll > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }

    lastScroll = currentScroll;
  });
})();
</script>
