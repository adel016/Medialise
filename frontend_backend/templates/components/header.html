<header style="
  background: var(--color-bg);
  border-bottom: 1px solid var(--color-border);
  position: sticky;
  top: 0;
  z-index: 1000;
">
  <div style="
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  ">
    <a href="/" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
      <i class="fas fa-pills" style="color:var(--color-primary); font-size:1.6rem;"></i>
      <span style="font-weight:700; font-size:1.4rem; color:var(--color-text);">MedicSearch</span>
    </a>

    <div class="header-actions" style="display:flex; align-items:center; gap:14px;">
      <div style="position:relative;">
        <button id="searchDropdownBtn" title="Recherche" style="
          width:40px; height:40px;
          border-radius:50%;
          border:none;
          cursor:pointer;
          background: rgba(37,99,235,0.1);
          color: var(--color-primary);
        ">
          <i class="fas fa-search"></i>
        </button>

        <div id="searchDropdownMenu" style="
          display:none;
          position:absolute;
          top:48px; left:0;
          background:#fff;
          border-radius:12px;
          box-shadow:0 12px 30px rgba(0,0,0,.12);
          min-width:240px;
          overflow:hidden;
          z-index:1001;
        ">
          <a href="/search" style="display:block; padding:14px 20px; text-decoration:none; color:var(--color-text);">Recherche classique</a>
          <a href="/vector-search" style="display:block; padding:14px 20px; text-decoration:none; color:var(--color-text);">Recherche vectorielle</a>
          <a href="/ai-search" style="display:block; padding:14px 20px; text-decoration:none; color:var(--color-text);">Recherche IA</a>
        </div>
      </div>

      {% if g.user %}
        <a href="{{ url_for('users.profile') }}" style="text-decoration:none; color:var(--color-text); font-weight:600;">Profil</a>
        <a href="{{ url_for('users.logout') }}" style="text-decoration:none; color:var(--color-primary); font-weight:600;">Déconnexion</a>
      {% else %}
        <a href="{{ url_for('users.login') }}" style="
          padding:8px 18px;
          border-radius:999px;
          border:2px solid var(--color-primary);
          color:var(--color-primary);
          font-weight:600;
          text-decoration:none;
        ">Connexion</a>
      {% endif %}
    </div>
  </div>
</header>

<script>
  // Dropdown search navbar
  (function () {
    const btn = document.getElementById('searchDropdownBtn');
    const menu = document.getElementById('searchDropdownMenu');
    if (!btn || !menu) return;

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    });

    document.addEventListener('click', function() {
      menu.style.display = 'none';
    });
  })();
</script>
